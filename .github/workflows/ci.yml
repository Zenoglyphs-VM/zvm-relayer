name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Linux, as most people who build this will be on.
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go build ./...
      - run: go vet ./...
      - run: go test -json -count=1 -timeout=3m ./...
      - run: go test -race -json -count=1 -timeout=5m ./...


  recovery-process:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify original public Core pin
        run: test "$(git -C zvm-core rev-parse HEAD)" = 29e6d9b30be94de3772c850c7a1e9811585a8833
      - name: Build the actual production relayer with race instrumentation
        run: go build -race -o "$RUNNER_TEMP/zvm-relayer-recovery" ./cmd/zvm-relayer
      - name: Qualify complete history and volatile or synchronous local admission in real processes
        env:
          ZVM_RELAYER_RECOVERY_BINARY: ${{ runner.temp }}/zvm-relayer-recovery
        run: go test -race -json -count=1 -timeout=3m -run '^Test(RecoveryCLIProcesses|DurableAdmissionCLIProcesses)$' ./cmd/zvm-relayer
